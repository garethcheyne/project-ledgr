name: ledgr

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ledgr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — see .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-ledgr}
      # Deterministic collation. Without this the image inherits the host
      # locale, and a restore onto a differently-configured host can reorder
      # indexes and silently corrupt them.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ledgr} -d ${POSTGRES_DB:-ledgr}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # appendonly keeps queued jobs across a restart. Without it a crash loses
    # every in-flight sync and outbound message.
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ledgr}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required — see .env.example}
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # One-shot: creates the attachments bucket, then exits. Buckets are not
  # auto-created on first write, so without this every upload 404s.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ledgr}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      S3_BUCKET: ${S3_BUCKET:-ledgr-attachments}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\" &&
      mc mb --ignore-existing local/$${S3_BUCKET} &&
      mc anonymous set none local/$${S3_BUCKET} &&
      echo 'Bucket ready:' $${S3_BUCKET}
      "
    restart: "no"

  # Throwaway IMAP/SMTP server for developing and testing the mail adapter.
  # Not started by default — bring it up explicitly:
  #   docker compose --profile dev up -d greenmail
  #
  # Unit tests can't catch what actually goes wrong with IMAP: flag semantics,
  # UID behaviour, MIME round-tripping, whether sent mail gets filed. Those only
  # surface against something that really speaks the protocol.
  #
  # The mail integration tests skip themselves when this isn't running, so
  # `pnpm test` stays green without it.
  greenmail:
    image: greenmail/standalone:2.1.0
    profiles: ["dev"]
    restart: "no"
    environment:
      # hostname=0.0.0.0 is required: GreenMail otherwise binds the container's
      # loopback and the published ports go nowhere.
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp
        -Dgreenmail.setup.test.imap
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=gareth:testpass@localhost
        -Dgreenmail.verbose
    ports:
      - "3143:3143"
      - "3025:3025"

  # One-shot: applies migrations before api/worker start, so they never boot
  # against a schema that hasn't caught up.
  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      target: migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
    command: ["pnpm", "--filter", "@ledgr/db", "migrate:deploy"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      target: runtime
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      API_PORT: 3001
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-ledgr-attachments}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-ledgr}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_FORCE_PATH_STYLE: "true"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required — openssl rand -base64 48}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required — openssl rand -base64 48}
      LEDGR_ENCRYPTION_KEY: ${LEDGR_ENCRYPTION_KEY:?LEDGR_ENCRYPTION_KEY is required — openssl rand -base64 32. Back it up separately from your data, or your backups are unreadable.}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5750}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3001}
    ports:
      - "${API_PORT:-3001}:3001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  sync-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.sync-worker
      target: runtime
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-ledgr-attachments}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-ledgr}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_FORCE_PATH_STYLE: "true"
      LEDGR_ENCRYPTION_KEY: ${LEDGR_ENCRYPTION_KEY:?LEDGR_ENCRYPTION_KEY is required}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      TESSERACT_PATH: /usr/bin/tesseract
      OCR_LANGUAGES: ${OCR_LANGUAGES:-eng}

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      target: runtime
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api/v1}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 5750
    ports:
      - "${WEB_PORT:-5750}:5750"

volumes:
  postgres-data:
  redis-data:
  minio-data:
