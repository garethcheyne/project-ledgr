name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  verify:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ledgr
          POSTGRES_PASSWORD: ledgr
          POSTGRES_DB: ledgr_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ledgr"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ledgr:ledgr@localhost:5432/ledgr_test?schema=public
      REDIS_URL: redis://localhost:6379
      # Test-only values. Distinct from each other on purpose — a shared secret
      # would let a refresh token pass as an access token, and the auth tests
      # must be able to catch that.
      JWT_ACCESS_SECRET: ci-access-secret-not-for-production
      JWT_REFRESH_SECRET: ci-refresh-secret-not-for-production

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply migrations
        run: pnpm --filter @ledgr/db migrate:deploy

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  docker:
    name: Build container images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build only — no push. Catches Dockerfile breakage on every PR without
      # needing registry credentials.
      - name: Build images
        run: docker compose build
